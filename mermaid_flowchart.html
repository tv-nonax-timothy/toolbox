<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaidフローチャートデザイナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3"><a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2.5 rounded-xl transition" title="道具箱のトップへ戻る"><i class="fa-solid fa-arrow-left"></i></a><div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-diagram-project text-xl"></i></div><div><h1 class="text-xl font-bold tracking-tight text-slate-900">Mermaidフローチャートデザイナー</h1><p class="text-xs text-slate-500">ノードと接続をGUIで組み立てて作成</p></div></div>
        <div class="flex items-center space-x-2"><button onclick="loadSample()" class="px-3 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"><i class="fa-solid fa-bolt mr-1"></i>サンプル読込</button><button onclick="openImport()" class="px-3 py-2 text-xs font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg"><i class="fa-solid fa-file-import mr-1"></i>既存コードのインポート</button><button onclick="sendToMarkdown()" class="px-3 py-2 text-xs font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>このままMarkdownメモへ送る</button><button onclick="returnToMarkdown()" class="px-3 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"><i class="fa-solid fa-arrow-left mr-1"></i>Markdownメモに戻る</button><button onclick="resetData()" class="px-3 py-2 text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg"><i class="fa-solid fa-trash-can mr-1"></i>リセット</button></div>
    </header>
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        <section class="w-full lg:w-1/2 flex flex-col bg-white border-r border-slate-200 overflow-hidden"><div class="flex items-center justify-between border-b border-slate-200 bg-slate-50/50 p-4"><div><h2 class="text-base font-bold">ノードと接続設定</h2><p class="text-xs text-slate-500">処理の流れを視覚的に定義します</p></div><button onclick="addNode()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>ノード追加</button></div><div class="flex-1 overflow-y-auto p-6 space-y-5"><div><h3 class="text-sm font-bold mb-3">ノード一覧</h3><div id="nodes" class="space-y-2"></div></div><div class="pt-4 border-t border-slate-200"><div class="flex items-center justify-between mb-3"><h3 class="text-sm font-bold">接続一覧</h3><button onclick="addEdge()" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg"><i class="fa-solid fa-link mr-1"></i>接続追加</button></div><div id="edges" class="space-y-2"></div></div></div></section>
        <section class="w-full lg:w-1/2 flex flex-col bg-slate-100 overflow-hidden"><div class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between"><span class="text-xs font-semibold"><i class="fa-solid fa-circle text-emerald-500 mr-2"></i>リアルタイムプレビュー</span><div class="space-x-2"><button onclick="copyCode()" class="border border-slate-300 px-3 py-1.5 rounded-lg text-xs"><i class="fa-regular fa-copy mr-1"></i>コピー</button><button onclick="downloadCode()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-download mr-1"></i>保存</button></div></div><div class="flex-1 m-4 p-6 overflow-auto flex items-center justify-center bg-white rounded-2xl shadow-inner border border-slate-200 min-h-[300px]"><div id="preview" class="w-full flex justify-center"></div></div><details class="mx-4 mb-4 bg-slate-900 text-slate-200 rounded-xl overflow-hidden"><summary class="px-4 py-2.5 text-xs font-mono cursor-pointer">自動生成されたMermaidコード</summary><pre id="code" class="p-4 text-xs text-emerald-400 overflow-auto max-h-40"></pre></details></section>
    </main>
    <div id="import-modal" class="hidden fixed inset-0 bg-slate-900/40 items-center justify-center p-4 z-40"><div class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden"><div class="flex justify-between px-5 py-4 border-b"><div><h2 class="font-bold">既存フローチャートコードをインポート</h2><p class="text-xs text-slate-500 mt-1">flowchart または graph から始まるコードを貼り付けてください</p></div><button onclick="closeImport()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark"></i></button></div><textarea id="import-text" rows="14" placeholder="flowchart TD\n    A[開始] --> B{判定}\n    B -->|Yes| C[完了]" class="w-full bg-slate-950 text-emerald-300 p-4 text-sm font-mono"></textarea><div class="flex justify-end gap-2 p-4 bg-slate-50 border-t"><button onclick="closeImport()" class="px-4 py-2 text-sm border rounded-lg">キャンセル</button><button onclick="importCode()" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg">GUIへ展開</button></div></div></div>
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs translate-y-20 opacity-0 transition-all"><span id="toast-text"></span></div>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
let data;
function sampleData() { return { direction: 'TD', nodes: [{ id: 'A', label: '開始', shape: 'round' }, { id: 'B', label: '入力を確認', shape: 'rect' }, { id: 'C', label: '問題あり？', shape: 'diamond' }, { id: 'D', label: '完了', shape: 'round' }], edges: [{ id: 'e1', from: 'A', to: 'B', label: '' }, { id: 'e2', from: 'B', to: 'C', label: '' }, { id: 'e3', from: 'C', to: 'D', label: 'いいえ' }, { id: 'e4', from: 'C', to: 'A', label: 'はい' }] }; }
function loadSample() { data = sampleData(); render(); toast('サンプルデータをロードしました'); }
function resetData() { data = { direction: 'TD', nodes: [], edges: [] }; render(); toast('リセットしました'); }
function id(prefix) { return prefix + '_' + Math.random().toString(36).substring(2, 8); }
function addNode() { data.nodes.push({ id: id('N'), label: '新しい処理', shape: 'rect' }); render(); }
function removeNode(nodeId) { data.nodes = data.nodes.filter(node => node.id !== nodeId); data.edges = data.edges.filter(edge => edge.from !== nodeId && edge.to !== nodeId); render(); }
function updateNode(nodeId, field, value) { const node = data.nodes.find(item => item.id === nodeId); node[field] = value; renderDiagram(); }
function addEdge() { if (data.nodes.length < 2) return toast('接続には2つ以上のノードが必要です'); data.edges.push({ id: id('E'), from: data.nodes[0].id, to: data.nodes[1].id, label: '' }); render(); }
function removeEdge(edgeId) { data.edges = data.edges.filter(edge => edge.id !== edgeId); render(); }
function updateEdge(edgeId, field, value) { const edge = data.edges.find(item => item.id === edgeId); edge[field] = value; renderDiagram(); }
function escapeLabel(value) { return String(value || '').replace(/["\\]/g, '\\$&').replace(/\n/g, ' '); }
function nodeCode(node) { const label = escapeLabel(node.label); if (node.shape === 'round') return `${node.id}([${label}])`; if (node.shape === 'diamond') return `${node.id}{${label}}`; if (node.shape === 'circle') return `${node.id}((${label}))`; return `${node.id}[${label}]`; }
function generateCode() { let result = `flowchart ${data.direction || 'TD'}\n`; data.nodes.forEach(node => { result += `    ${nodeCode(node)}\n`; }); data.edges.forEach(edge => { const connection = edge.label ? ` -->|${escapeLabel(edge.label)}| ` : ' --> '; result += `    ${edge.from}${connection}${edge.to}\n`; }); return result; }
function render() { renderGui(); renderDiagram(); }
function renderGui() { document.getElementById('nodes').innerHTML = data.nodes.map(node => `<div class="flex items-center gap-2 bg-slate-50 border p-2.5 rounded-xl"><input value="${node.label}" oninput="updateNode('${node.id}','label',this.value)" class="flex-1 border rounded px-2 py-1 text-xs"><select onchange="updateNode('${node.id}','shape',this.value)" class="border rounded px-2 py-1 text-xs"><option value="rect" ${node.shape === 'rect' ? 'selected' : ''}>処理</option><option value="round" ${node.shape === 'round' ? 'selected' : ''}>開始・終了</option><option value="diamond" ${node.shape === 'diamond' ? 'selected' : ''}>判定</option><option value="circle" ${node.shape === 'circle' ? 'selected' : ''}>円形</option></select><span class="text-[10px] text-slate-400 font-mono w-16">${node.id}</span><button onclick="removeNode('${node.id}')" class="text-rose-500 p-1"><i class="fa-solid fa-trash"></i></button></div>`).join(''); const options = data.nodes.map(node => `<option value="${node.id}">${node.id}: ${node.label}</option>`).join(''); document.getElementById('edges').innerHTML = data.edges.map(edge => `<div class="flex items-center gap-2 bg-white border p-2.5 rounded-xl"><select onchange="updateEdge('${edge.id}','from',this.value)" class="flex-1 border rounded px-2 py-1 text-xs">${options.replace(new RegExp('value="' + edge.from + '"'), 'value="' + edge.from + '" selected')}</select><span class="text-slate-400">→</span><select onchange="updateEdge('${edge.id}','to',this.value)" class="flex-1 border rounded px-2 py-1 text-xs">${options.replace(new RegExp('value="' + edge.to + '"'), 'value="' + edge.to + '" selected')}</select><input value="${edge.label}" placeholder="接続ラベル" oninput="updateEdge('${edge.id}','label',this.value)" class="w-24 border rounded px-2 py-1 text-xs"><button onclick="removeEdge('${edge.id}')" class="text-rose-500 p-1"><i class="fa-solid fa-trash"></i></button></div>`).join(''); }
async function renderDiagram() { const code = generateCode(); document.getElementById('code').textContent = code; try { const result = await mermaid.render('flow-' + Date.now(), code); document.getElementById('preview').innerHTML = result.svg; } catch (error) { document.getElementById('preview').innerHTML = '<p class="text-rose-500 text-sm">Mermaidコードを描画できません</p>'; } }
function openImport() { document.getElementById('import-modal').classList.remove('hidden'); document.getElementById('import-modal').classList.add('flex'); document.getElementById('import-text').focus(); }
function closeImport() { document.getElementById('import-modal').classList.add('hidden'); document.getElementById('import-modal').classList.remove('flex'); }
function importCode() { try { const lines = document.getElementById('import-text').value.split(/\r?\n/); const first = lines.find(line => line.trim()); if (!first || !/^(flowchart|graph)\b/i.test(first.trim())) throw new Error('flowchart または graph から始まるコードを入力してください'); const directionMatch = first.trim().match(/^(?:flowchart|graph)\s+([A-Za-z]+)/i); const nodes = []; const edges = []; const nodeMap = new Map(); const getNode = (nodeId, label) => { if (!nodeMap.has(nodeId)) { const node = { id: nodeId, label: label || nodeId, shape: 'rect' }; nodeMap.set(nodeId, node); nodes.push(node); } else if (label) nodeMap.get(nodeId).label = label; return nodeMap.get(nodeId); }; lines.slice(1).forEach(line => { const text = line.trim(); if (!text || text.startsWith('%%') || text.startsWith('subgraph') || text === 'end') return; const edge = text.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*-->(?:\|([^|]*)\|)?\s*([A-Za-z_][A-Za-z0-9_]*)/); const definitions = [...text.matchAll(/([A-Za-z_][A-Za-z0-9_]*)\s*(\(\(([^)]*)\)\)|\(\[?([^\])]+)\]?\)|\{([^}]*)\}|\[([^\]]*)\])/g)]; definitions.forEach(match => { const label = match[3] || match[4] || match[5] || match[6] || match[1]; const shape = match[3] ? 'circle' : match[5] ? 'diamond' : match[4] ? 'round' : 'rect'; getNode(match[1], label).shape = shape; }); if (edge) { getNode(edge[1]); getNode(edge[3]); edges.push({ id: id('E'), from: edge[1], to: edge[3], label: edge[2] || '' }); } }); if (!nodes.length) throw new Error('ノードを読み取れませんでした'); data = { direction: directionMatch ? directionMatch[1].toUpperCase() : 'TD', nodes, edges }; closeImport(); render(); toast('フローチャートをGUIへ展開しました'); } catch (error) { toast(error.message); } }
function sendToMarkdown() { const request = JSON.parse(sessionStorage.getItem('mermaid_edit_request') || '{}'); sessionStorage.setItem('mermaid_return_payload', JSON.stringify({ type: 'flowchart', code: generateCode(), source: request.source || null, start: request.start ?? null, end: request.end ?? null, blockText: request.blockText || null })); window.location.href = 'markdown_memo.html'; }
function returnToMarkdown() { sessionStorage.removeItem('mermaid_edit_request'); sessionStorage.removeItem('mermaid_return_payload'); window.location.href = 'markdown_memo.html'; }
function copyCode() { navigator.clipboard.writeText(generateCode()); toast('コードをコピーしました'); }
function downloadCode() { const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([generateCode()], { type: 'text/plain;charset=utf-8' })); link.download = 'flowchart.mmd'; link.click(); toast('ファイルを保存しました'); }
function toast(message) { const element = document.getElementById('toast'); document.getElementById('toast-text').textContent = message; element.classList.remove('translate-y-20', 'opacity-0'); setTimeout(() => element.classList.add('translate-y-20', 'opacity-0'), 2200); }
window.onload = () => { data = sampleData(); const request = JSON.parse(sessionStorage.getItem('mermaid_edit_request') || 'null'); if (request && request.type === 'flowchart' && request.code) { document.getElementById('import-text').value = request.code; importCode(); } else render(); };
</script>
</body>
</html>
