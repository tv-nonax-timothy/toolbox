<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方眼紙Excel PDF/画像変換ツール - のなっくすの道具箱</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZip for reading Excel style definitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- SheetJS (xlsx) for Excel parsing with cell styles -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- html2canvas for image export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1p"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'M PLUS Rounded 1p', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* Excel Grid & Border Preservation Styling */
        .excel-preview-wrapper {
            background: #ffffff;
            padding: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .excel-table {
            border-collapse: collapse;
            table-layout: fixed;
            background: #ffffff;
            font-size: 11px;
        }
        .excel-table td {
            border: 1px solid transparent; /* Default to transparent so only explicit borders show */
            padding: 4px 6px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            height: 24px;
        }
        /* If user enables gridlines toggle, show light borders */
        .show-gridlines-enabled td {
            border: 1px solid #e2e8f0 !important;
        }

        /* Specific Border Styles for 方眼紙 (Grid) */
        .border-t-thin { border-top: 1px solid #000000 !important; }
        .border-b-thin { border-bottom: 1px solid #000000 !important; }
        .border-l-thin { border-left: 1px solid #000000 !important; }
        .border-r-thin { border-right: 1px solid #000000 !important; }

        .border-t-medium { border-top: 2px solid #000000 !important; }
        .border-b-medium { border-bottom: 2px solid #000000 !important; }
        .border-l-medium { border-left: 2px solid #000000 !important; }
        .border-r-medium { border-right: 2px solid #000000 !important; }

        .border-t-double { border-top: 3px double #000000 !important; }
        .border-b-double { border-bottom: 3px double #000000 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white text-lg shadow-sm">
                        <i class="fa-solid fa-file-pdf"></i>
                    </div>
                    <h1 class="text-lg sm:text-xl font-extrabold text-slate-900">方眼紙Excel PDF/画像 変換ツール</h1>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <span id="status-msg" class="text-xs text-slate-500 font-medium hidden sm:inline"><i class="fa-solid fa-check text-brand-500 mr-1"></i>準備完了（罫線・方眼紙対応）</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-6">
        
        <!-- Left Sidebar: Controls & File Drop -->
        <div class="w-full lg:w-1/3 flex flex-col space-y-6">
            
            <!-- File Drop Box -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-file-excel text-brand-600"></i>
                    <span>1. 方眼紙Excelファイルを選択</span>
                </h3>
                <div id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl p-6 text-center cursor-pointer transition-all bg-slate-50/50 hover:bg-brand-50/30">
                    <div class="w-12 h-12 bg-white rounded-2xl shadow-sm border border-slate-200 flex items-center justify-center mx-auto mb-3 text-brand-600 text-xl">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <p class="text-xs font-bold text-slate-700 mb-1">ここにExcelファイルをドラッグ＆ドロップ</p>
                    <p class="text-[10px] text-slate-400 mb-3">またはクリックしてファイルを選択 (.xlsx, .xls)</p>
                    <input type="file" id="file-input" accept=".xlsx, .xls" class="hidden" onchange="handleFileSelect(event)">
                    <button onclick="document.getElementById('file-input').click()" class="bg-white hover:bg-slate-100 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs border border-slate-200 shadow-sm transition-all">
                        ファイルを選択
                    </button>
                </div>
                <div id="file-info" class="mt-3 text-xs text-slate-500 hidden flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <span id="file-name" class="font-bold text-slate-800 truncate max-w-[200px]"></span>
                    <span id="sheet-count" class="text-brand-600 font-bold shrink-0"></span>
                </div>
            </div>

            <!-- Sheet Selection & Layout Options -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex flex-col space-y-4">
                <h3 class="text-sm font-bold text-slate-800 flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-sky-500"></i>
                    <span>2. 罫線・レイアウト設定</span>
                </h3>

                <!-- Sheet Selector -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">変換するシート</label>
                    <select id="sheet-select" onchange="renderSheetPreview()" class="w-full text-xs font-bold bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-slate-700 focus:outline-none focus:border-brand-500" disabled>
                        <option value="">ファイルをアップロードしてください</option>
                    </select>
                </div>

                <!-- Orientation -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">用紙の向き（PDF用）</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-portrait" onclick="setOrientation('portrait')" class="py-2 px-3 rounded-xl text-xs font-bold border border-brand-500 bg-brand-50 text-brand-700 transition-all">
                            <i class="fa-solid fa-file mr-1"></i> 縦 (Portrait)
                        </button>
                        <button type="button" id="btn-landscape" onclick="setOrientation('landscape')" class="py-2 px-3 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-600 transition-all">
                            <i class="fa-solid fa-file fa-rotate-90 mr-1"></i> 横 (Landscape)
                        </button>
                    </div>
                </div>

                <!-- Gridlines Toggle -->
                <div class="flex items-center justify-between pt-2">
                    <span class="text-xs font-bold text-slate-700">方眼紙のグリッド線（罫線なし部分）を表示</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="show-gridlines" onchange="renderSheetPreview()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand-600"></div>
                    </label>
                </div>
            </div>

            <!-- Export Actions -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex flex-col space-y-3">
                <h3 class="text-sm font-bold text-slate-800 mb-1 flex items-center space-x-2">
                    <i class="fa-solid fa-download text-brand-600"></i>
                    <span>3. エクスポート</span>
                </h3>
                <button onclick="exportPDF()" id="btn-pdf" disabled class="w-full bg-brand-600 hover:bg-brand-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold py-3 px-4 rounded-2xl text-xs sm:text-sm shadow-md shadow-brand-600/30 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>PDFとしてダウンロード</span>
                </button>
                <button onclick="exportImage()" id="btn-img" disabled class="w-full bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold py-3 px-4 rounded-2xl text-xs sm:text-sm shadow-md transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-image"></i>
                    <span>画像 (PNG) としてダウンロード</span>
                </button>
            </div>

        </div>

        <!-- Right Pane: Live Preview Area -->
        <div class="w-full lg:w-2/3 flex flex-col bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
                <span class="text-xs font-bold text-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-eye text-sky-500"></i>
                    <span>プレビュー（方眼紙レイアウト・罫線保持）</span>
                </span>
                <span id="preview-info" class="text-xs text-slate-400 font-medium">シート未選択</span>
            </div>
            
            <div class="flex-grow p-6 overflow-auto bg-slate-100/50 flex items-center justify-center min-h-[500px]">
                <div id="preview-container" class="excel-preview-wrapper rounded-2xl border border-slate-200 max-w-full overflow-x-auto">
                    <div class="text-center text-slate-400 py-16">
                        <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-slate-300 text-2xl">
                            <i class="fa-solid fa-table-cells"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-500 mb-1">プレビュー表示エリア</p>
                        <p class="text-xs text-slate-400">左側から方眼紙Excelファイルを選択してください</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        let workbook = null;
        let borderStyles = null;
        let currentOrientation = 'portrait';
        const statusMsg = document.getElementById('status-msg');

        // Drag and drop setup
        const dropZone = document.getElementById('drop-zone');
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('border-brand-500', 'bg-brand-50/50'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('border-brand-500', 'bg-brand-50/50'); }, false);
        });
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                document.getElementById('file-input').files = files;
                handleFileSelect({ target: { files: files } });
            }
        }, false);

        function setOrientation(mode) {
            currentOrientation = mode;
            if (mode === 'portrait') {
                document.getElementById('btn-portrait').className = 'py-2 px-3 rounded-xl text-xs font-bold border border-brand-500 bg-brand-50 text-brand-700 transition-all';
                document.getElementById('btn-landscape').className = 'py-2 px-3 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-600 transition-all';
            } else {
                document.getElementById('btn-landscape').className = 'py-2 px-3 rounded-xl text-xs font-bold border border-brand-500 bg-brand-50 text-brand-700 transition-all';
                document.getElementById('btn-portrait').className = 'py-2 px-3 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-600 transition-all';
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-info').classList.remove('hidden');
            statusMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-brand-500 mr-1"></i>ファイルを読み込み中...';

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array', cellStyles: true, cellFormulas: true, cellDates: true });
                    borderStyles = await readExcelBorderStyles(data);
                    
                    const sheetSelect = document.getElementById('sheet-select');
                    sheetSelect.innerHTML = '';
                    workbook.SheetNames.forEach((name) => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        sheetSelect.appendChild(opt);
                    });
                    sheetSelect.disabled = false;

                    document.getElementById('sheet-count').textContent = `${workbook.SheetNames.length} シート`;
                    statusMsg.innerHTML = '<i class="fa-solid fa-check text-brand-500 mr-1"></i>読み込み完了（罫線対応）';
                    
                    renderSheetPreview();
                    document.getElementById('btn-pdf').disabled = false;
                    document.getElementById('btn-img').disabled = false;
                } catch (err) {
                    statusMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>読み込みエラー';
                    alert('Excelファイルの解析に失敗しました: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function readExcelBorderStyles(data) {
            if (!window.JSZip || !data || data[0] !== 0x50 || data[1] !== 0x4b) return null;

            const zip = await JSZip.loadAsync(data);
            const stylesXml = await zip.file('xl/styles.xml')?.async('string');
            if (!stylesXml) return null;

            const stylesDoc = new DOMParser().parseFromString(stylesXml, 'application/xml');
            const borders = Array.from(stylesDoc.getElementsByTagName('border'));
            const cellXfs = Array.from(stylesDoc.getElementsByTagName('cellXfs')[0]?.getElementsByTagName('xf') || []);
            const borderDefinitions = borders.map((border) => {
                const sides = {};
                ['top', 'right', 'bottom', 'left'].forEach((sideName) => {
                    const side = border.getElementsByTagName(sideName)[0];
                    if (!side) return;
                    const color = side.getElementsByTagName('color')[0]?.getAttribute('rgb');
                    sides[sideName] = {
                        style: side.getAttribute('style'),
                        color: color && color.length === 8 ? `#${color.slice(2)}` : '#000000'
                    };
                });
                return sides;
            });

            const sheets = {};
            const worksheetEntries = zip.file(/^xl\/worksheets\/sheet\d+\.xml$/);
            for (const worksheetEntry of worksheetEntries) {
                const sheetXml = await worksheetEntry.async('string');
                const sheetDoc = new DOMParser().parseFromString(sheetXml, 'application/xml');
                const cellStyles = {};
                Array.from(sheetDoc.getElementsByTagName('c')).forEach((cell) => {
                    const styleIndex = cell.getAttribute('s');
                    if (styleIndex !== null) cellStyles[cell.getAttribute('r')] = Number(styleIndex);
                });
                sheets[worksheetEntry.name.match(/sheet(\d+)\.xml$/)[1]] = cellStyles;
            }

            return { styles: cellXfs.map((xf) => borderDefinitions[Number(xf.getAttribute('borderId'))] || null), sheets };
        }

        function borderCss(border) {
            if (!border || !border.style) return '';
            const widths = { hair: '1px', thin: '1px', medium: '2px', thick: '3px' };
            const patterns = {
                dashed: 'dashed', dotted: 'dotted', double: 'double',
                dashDot: 'dashed', dashDotDot: 'dashed', slantDashDot: 'dashed'
            };
            const width = widths[border.style] || '1px';
            const pattern = patterns[border.style] || 'solid';
            return `${width} ${pattern} ${border.color || '#000000'}`;
        }

        function applyExcelBorders(worksheet, tableEl) {
            if (!borderStyles || !tableEl) return;
            const range = XLSX.utils.decode_range(worksheet['!ref'] || 'A1');
            const sheetIndex = workbook.SheetNames.indexOf(document.getElementById('sheet-select').value) + 1;
            const cellStyles = borderStyles.sheets[String(sheetIndex)] || {};
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const address = XLSX.utils.encode_cell({ r: R, c: C });
                    const cellEl = tableEl.querySelector(`#sjs-${address}`);
                    const styleIndex = cellStyles[address];
                    const border = styleIndex === undefined ? null : borderStyles.styles[styleIndex];
                    if (!cellEl || !border) continue;
                    ['top', 'right', 'bottom', 'left'].forEach((side) => {
                        const css = borderCss(border[side]);
                        if (css) cellEl.style[`border${side[0].toUpperCase()}${side.slice(1)}`] = css;
                    });
                }
            }
        }

        function renderSheetPreview() {
            if (!workbook) return;
            const sheetName = document.getElementById('sheet-select').value;
            const worksheet = workbook.Sheets[sheetName];
            const showGrid = document.getElementById('show-gridlines').checked;
            
            // Convert sheet to HTML table
            let htmlTable = XLSX.utils.sheet_to_html(worksheet, { header: 1 });
            
            const container = document.getElementById('preview-container');
            container.innerHTML = `<div class="overflow-x-auto">${htmlTable}</div>`;
            
            const tableEl = container.querySelector('table');
            if (tableEl) {
                tableEl.className = 'excel-table';
                if (showGrid) {
                    tableEl.classList.add('show-gridlines-enabled');
                }
            }

            applyExcelBorders(worksheet, tableEl);

            document.getElementById('preview-info').textContent = `シート: ${sheetName}`;
        }

        async function exportPDF() {
            const container = document.getElementById('preview-container');
            statusMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-brand-500 mr-1"></i>PDFを生成中...';
            
            try {
                const canvas = await html2canvas(container, { scale: 2, useCORS: true, logging: false });
                const imgData = canvas.toDataURL('image/png');
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: currentOrientation,
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                
                const imgWidth = pageWidth - 20; // 10mm margins
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                
                const sheetName = document.getElementById('sheet-select').value;
                pdf.save(`方眼紙Excel_${sheetName}.pdf`);
                
                statusMsg.innerHTML = '<i class="fa-solid fa-check text-brand-500 mr-1"></i>PDF保存成功';
            } catch (err) {
                statusMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>PDF生成エラー';
                alert('PDFの出力に失敗しました: ' + err.message);
            }
        }

        async function exportImage() {
            const container = document.getElementById('preview-container');
            statusMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-brand-500 mr-1"></i>画像を生成中...';

            try {
                const canvas = await html2canvas(container, { scale: 2, useCORS: true, logging: false });
                const link = document.createElement('a');
                const sheetName = document.getElementById('sheet-select').value;
                link.download = `方眼紙Excel_${sheetName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                statusMsg.innerHTML = '<i class="fa-solid fa-check text-brand-500 mr-1"></i>画像保存成功';
            } catch (err) {
                statusMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>画像生成エラー';
                alert('画像の出力に失敗しました: ' + err.message);
            }
        }
    </script>
</body>
</html>
