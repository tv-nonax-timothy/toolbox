<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaidシーケンス図デザイナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3"><a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2.5 rounded-xl transition" title="道具箱のトップへ戻る"><i class="fa-solid fa-arrow-left"></i></a><div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-right-left text-xl"></i></div><div><h1 class="text-xl font-bold tracking-tight text-slate-900">Mermaidシーケンス図デザイナー</h1><p class="text-xs text-slate-500">アクターとメッセージフローをGUIで作成</p></div></div>
        <div class="flex items-center space-x-2"><button onclick="loadSample()" class="px-3 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"><i class="fa-solid fa-bolt mr-1"></i>サンプル読込</button><button onclick="openImport()" class="px-3 py-2 text-xs font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg"><i class="fa-solid fa-file-import mr-1"></i>既存コードのインポート</button><button onclick="sendToMarkdown()" class="px-3 py-2 text-xs font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>このままMarkdownメモへ送る</button><button onclick="returnToMarkdown()" class="px-3 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"><i class="fa-solid fa-arrow-left mr-1"></i>Markdownメモに戻る</button><button onclick="resetData()" class="px-3 py-2 text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg"><i class="fa-solid fa-trash-can mr-1"></i>リセット</button></div>
    </header>
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        <section class="w-full lg:w-1/2 flex flex-col bg-white border-r border-slate-200 overflow-hidden"><div class="flex items-center justify-between border-b border-slate-200 bg-slate-50/50 p-4"><div><h2 class="text-base font-bold">アクターとメッセージ設定</h2><p class="text-xs text-slate-500">メッセージの順番はドラッグ＆ドロップで変更できます</p></div><button onclick="addActor()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg"><i class="fa-solid fa-user-plus mr-1"></i>アクター追加</button></div><div class="flex-1 overflow-y-auto p-6 space-y-5"><div class="bg-slate-50 p-4 rounded-xl border"><label class="block text-xs font-semibold text-slate-600 mb-2">定義済みアクター</label><div id="actors" class="flex flex-wrap gap-2"></div><div class="mt-3 flex gap-2"><input id="actor-input" placeholder="例: 決済API" class="flex-1 border rounded-lg px-3 py-1.5 text-sm"><button onclick="addActorFromInput()" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg text-sm">追加</button></div></div><div><div class="flex items-center justify-between mb-3"><h3 class="text-sm font-bold">メッセージフロー</h3><button onclick="addMessage()" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>メッセージ追加</button></div><div id="messages" class="space-y-2"></div></div></div></section>
        <section class="w-full lg:w-1/2 flex flex-col bg-slate-100 overflow-hidden"><div class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between"><span class="text-xs font-semibold"><i class="fa-solid fa-circle text-emerald-500 mr-2"></i>リアルタイムプレビュー</span><div class="space-x-2"><button onclick="copyCode()" class="border border-slate-300 px-3 py-1.5 rounded-lg text-xs"><i class="fa-regular fa-copy mr-1"></i>コピー</button><button onclick="downloadCode()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-download mr-1"></i>保存</button></div></div><div class="flex-1 m-4 p-6 overflow-auto flex items-center justify-center bg-white rounded-2xl shadow-inner border border-slate-200 min-h-[300px]"><div id="preview" class="w-full flex justify-center"></div></div><details class="mx-4 mb-4 bg-slate-900 text-slate-200 rounded-xl overflow-hidden"><summary class="px-4 py-2.5 text-xs font-mono cursor-pointer">自動生成されたMermaidコード</summary><pre id="code" class="p-4 text-xs text-emerald-400 overflow-auto max-h-40"></pre></details></section>
    </main>
    <div id="import-modal" class="hidden fixed inset-0 bg-slate-900/40 items-center justify-center p-4 z-40"><div class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden"><div class="flex justify-between px-5 py-4 border-b"><div><h2 class="font-bold">既存シーケンス図コードをインポート</h2><p class="text-xs text-slate-500 mt-1">sequenceDiagramから始まるコードを貼り付けてください</p></div><button onclick="closeImport()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark"></i></button></div><textarea id="import-text" rows="14" placeholder="sequenceDiagram\n    participant Client\n    participant Server\n    Client->>Server: APIリクエスト" class="w-full bg-slate-950 text-emerald-300 p-4 text-sm font-mono"></textarea><div class="flex justify-end gap-2 p-4 bg-slate-50 border-t"><button onclick="closeImport()" class="px-4 py-2 text-sm border rounded-lg">キャンセル</button><button onclick="importCode()" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg">GUIへ展開</button></div></div></div>
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs translate-y-20 opacity-0 transition-all"><span id="toast-text"></span></div>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
let data;
function sampleData() { return { actors: ['Client', 'Server', 'Database'], messages: [{ id: 'm1', from: 'Client', to: 'Server', arrow: '->>', text: 'APIリクエスト (GET /users)' }, { id: 'm2', from: 'Server', to: 'Database', arrow: '->>', text: 'SELECT * FROM users' }, { id: 'm3', from: 'Database', to: 'Server', arrow: '-->>', text: 'レコード返却' }, { id: 'm4', from: 'Server', to: 'Client', arrow: '-->>', text: 'JSONレスポンス' }] }; }
function loadSample() { data = sampleData(); render(); toast('サンプルデータをロードしました'); }
function resetData() { data = { actors: ['User', 'System'], messages: [] }; render(); toast('リセットしました'); }
function id(prefix) { return prefix + '_' + Math.random().toString(36).substring(2, 8); }
function addActor() { const name = prompt('追加するアクター名を入力してください'); if (name && !data.actors.includes(name.trim())) { data.actors.push(name.trim()); render(); } }
function addActorFromInput() { const input = document.getElementById('actor-input'); const name = input.value.trim(); if (name && !data.actors.includes(name)) { data.actors.push(name); input.value = ''; render(); } }
function removeActor(actor) { data.actors = data.actors.filter(item => item !== actor); data.messages = data.messages.filter(message => message.from !== actor && message.to !== actor); render(); }
function addMessage() { if (!data.actors.length) return toast('先にアクターを追加してください'); data.messages.push({ id: id('m'), from: data.actors[0], to: data.actors[1] || data.actors[0], arrow: '->>', text: 'メッセージ内容' }); render(); }
function removeMessage(messageId) { data.messages = data.messages.filter(message => message.id !== messageId); render(); }
function updateMessage(messageId, field, value) { const message = data.messages.find(item => item.id === messageId); message[field] = value; renderDiagram(); }
function actorId(actor, index) { return 'actor_' + index + '_' + String(actor).replace(/[^A-Za-z0-9_]/g, '_'); }
function generateCode() { const ids = new Map(data.actors.map((actor, index) => [actor, actorId(actor, index)])); let result = 'sequenceDiagram\n'; data.actors.forEach(actor => { result += `    participant ${ids.get(actor)} as "${String(actor).replace(/"/g, '\\"')}"\n`; }); data.messages.forEach(message => { result += `    ${ids.get(message.from) || 'actor'}${message.arrow}${ids.get(message.to) || 'actor'}: ${message.text}\n`; }); return result; }
function render() { renderGui(); renderDiagram(); }
function renderGui() { document.getElementById('actors').innerHTML = data.actors.map(actor => `<span class="inline-flex items-center bg-white border px-3 py-1 rounded-lg text-xs">${actor}<button onclick="removeActor('${actor}')" class="ml-2 text-rose-500"><i class="fa-solid fa-xmark"></i></button></span>`).join(''); document.getElementById('messages').innerHTML = data.messages.map((message, index) => `<div draggable="true" ondragstart="dragStart(event,${index})" ondragover="dragOver(event)" ondrop="dropMessage(event,${index})" class="flex items-center gap-2 bg-white border p-3 rounded-xl shadow-sm"><i class="fa-solid fa-grip-vertical text-slate-300"></i><select onchange="updateMessage('${message.id}','from',this.value)" class="border rounded px-2 py-1 text-xs w-24">${data.actors.map(actor => `<option ${actor === message.from ? 'selected' : ''}>${actor}</option>`).join('')}</select><select onchange="updateMessage('${message.id}','arrow',this.value)" class="border rounded px-2 py-1 text-xs w-20"><option value="->>" ${message.arrow === '->>' ? 'selected' : ''}>->> 実線</option><option value="-->>" ${message.arrow === '-->>' ? 'selected' : ''}>-->> 点線</option><option value="-x" ${message.arrow === '-x' ? 'selected' : ''}>-x 非同期</option><option value="-" ${message.arrow === '-' ? 'selected' : ''}>- なし</option></select><select onchange="updateMessage('${message.id}','to',this.value)" class="border rounded px-2 py-1 text-xs w-24">${data.actors.map(actor => `<option ${actor === message.to ? 'selected' : ''}>${actor}</option>`).join('')}</select><input value="${message.text}" oninput="updateMessage('${message.id}','text',this.value)" class="flex-1 border rounded px-2 py-1 text-xs"><button onclick="removeMessage('${message.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></div>`).join(''); }
let draggedIndex = null;
function dragStart(event, index) { draggedIndex = index; event.dataTransfer.effectAllowed = 'move'; }
function dragOver(event) { event.preventDefault(); }
function dropMessage(event, index) { event.preventDefault(); if (draggedIndex !== null && draggedIndex !== index) { const moved = data.messages.splice(draggedIndex, 1)[0]; data.messages.splice(index, 0, moved); render(); } draggedIndex = null; }
async function renderDiagram() { const code = generateCode(); document.getElementById('code').textContent = code; try { const result = await mermaid.render('sequence-' + Date.now(), code); document.getElementById('preview').innerHTML = result.svg; } catch (error) { document.getElementById('preview').innerHTML = '<p class="text-rose-500 text-sm">Mermaidコードを描画できません</p>'; } }
function openImport() { document.getElementById('import-modal').classList.remove('hidden'); document.getElementById('import-modal').classList.add('flex'); document.getElementById('import-text').focus(); }
function closeImport() { document.getElementById('import-modal').classList.add('hidden'); document.getElementById('import-modal').classList.remove('flex'); }
function importCode() { try { const lines = document.getElementById('import-text').value.split(/\r?\n/); const first = lines.find(line => line.trim()); if (!first || first.trim().toLowerCase() !== 'sequencediagram') throw new Error('sequenceDiagramから始まるコードを入力してください'); const actors = []; const labels = new Map(); const messages = []; lines.slice(1).forEach(line => { const participant = line.match(/^\s*participant\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+as\s+"([^"]*)")?\s*$/); const message = line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*(->>|-->>|->|-x|-)\s*([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(.*)$/); if (participant) { if (!actors.includes(participant[1])) actors.push(participant[1]); labels.set(participant[1], participant[2] || participant[1]); } else if (message) { if (!actors.includes(message[1])) actors.push(message[1]); if (!actors.includes(message[3])) actors.push(message[3]); messages.push({ id: id('m'), from: message[1], to: message[3], arrow: message[2], text: message[4] }); } }); data = { actors: actors.map(actor => labels.get(actor) || actor), messages: messages.map(message => ({ ...message, from: labels.get(message.from) || message.from, to: labels.get(message.to) || message.to })) }; if (!data.actors.length) throw new Error('アクターを読み取れませんでした'); closeImport(); render(); toast('シーケンス図をGUIへ展開しました'); } catch (error) { toast(error.message); } }
function sendToMarkdown() { const request = JSON.parse(sessionStorage.getItem('mermaid_edit_request') || '{}'); sessionStorage.setItem('mermaid_return_payload', JSON.stringify({ type: 'sequence', code: generateCode(), source: request.source || null, start: request.start ?? null, end: request.end ?? null, blockText: request.blockText || null })); window.location.href = 'markdown_memo.html'; }
function returnToMarkdown() { sessionStorage.removeItem('mermaid_edit_request'); sessionStorage.removeItem('mermaid_return_payload'); window.location.href = 'markdown_memo.html'; }
function copyCode() { navigator.clipboard.writeText(generateCode()); toast('コードをコピーしました'); }
function downloadCode() { const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([generateCode()], { type: 'text/plain;charset=utf-8' })); link.download = 'sequence-diagram.mmd'; link.click(); toast('ファイルを保存しました'); }
function toast(message) { const element = document.getElementById('toast'); document.getElementById('toast-text').textContent = message; element.classList.remove('translate-y-20', 'opacity-0'); setTimeout(() => element.classList.add('translate-y-20', 'opacity-0'), 2200); }
window.onload = () => { data = sampleData(); const request = JSON.parse(sessionStorage.getItem('mermaid_edit_request') || 'null'); if (request && request.type === 'sequence' && request.code) { document.getElementById('import-text').value = request.code; importCode(); } else render(); };
</script>
</body>
</html>
