<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel / CSV → Markdown テーブル変換 - のなっくすの道具箱</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1p"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'M PLUS Rounded 1p', sans-serif; background-color: #f8fafc; color: #1e293b; }
        textarea { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white text-lg shadow-sm">
                        <i class="fa-solid fa-table"></i>
                    </div>
                    <h1 class="text-lg sm:text-xl font-extrabold text-slate-900">Excel / CSV → Markdown テーブル変換</h1>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <span id="status-msg" class="text-xs text-slate-400 font-medium hidden sm:inline"><i class="fa-solid fa-check text-brand-500 mr-1"></i>準備完了</span>
                <button onclick="loadSample()" class="bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold px-3.5 py-2 rounded-xl text-xs sm:text-sm transition-all flex items-center space-x-1.5 border border-brand-200">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>サンプル読込</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-6 relative lg:h-[calc(100vh-6rem)]">
        
        <!-- Left Pane: Excel / CSV Input -->
        <div class="w-full lg:w-1/2 flex flex-col bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden lg:h-full">
            <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex items-center justify-between shrink-0">
                <span class="text-xs font-bold text-slate-600 flex items-center space-x-2">
                    <i class="fa-solid fa-file-excel text-brand-600"></i>
                    <span>Excel / スプレッドシート / CSV貼り付け</span>
                </span>
                <button onclick="clearInput()" class="text-xs font-bold text-slate-400 hover:text-rose-600 transition-colors">
                    <i class="fa-solid fa-trash-can mr-1"></i>クリア
                </button>
            </div>
            <textarea id="input-text" oninput="convertTable()" placeholder="ExcelやGoogleスプレッドシートからコピーした表（タブ区切り）をここに貼り付けてください... (Ctrl + V)" class="flex-grow w-full p-5 text-sm sm:text-base resize-none focus:outline-none min-h-[300px] lg:min-h-0 leading-relaxed overflow-y-auto"></textarea>
            <div class="px-5 py-2.5 bg-slate-50 border-t border-slate-100 text-xs text-slate-400 flex items-center justify-between">
                <span>💡 Excelのセルをそのままコピー＆ペーストできます</span>
            </div>
        </div>

        <!-- Right Pane: Markdown Output -->
        <div class="w-full lg:w-1/2 flex flex-col bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden lg:h-full">
            <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex items-center justify-between shrink-0">
                <span class="text-xs font-bold text-slate-600 flex items-center space-x-2">
                    <i class="fa-solid fa-code text-sky-500"></i>
                    <span>Markdown テーブル結果</span>
                </span>
                <button onclick="copyOutput()" class="text-xs font-bold text-slate-600 hover:text-brand-600 transition-colors flex items-center space-x-1">
                    <i class="fa-regular fa-copy"></i>
                    <span>マークダウンをコピー</span>
                </button>
            </div>
            <textarea id="output-text" readonly placeholder="ここにMarkdownの表形式が出力されます..." class="flex-grow w-full p-5 text-sm sm:text-base resize-none focus:outline-none min-h-[300px] lg:min-h-0 leading-relaxed bg-slate-50/50 overflow-y-auto font-mono"></textarea>
            <div class="px-5 py-2.5 bg-slate-50 border-t border-slate-100 text-xs text-slate-500 flex items-center justify-between">
                <span id="stats-info">行: 0 / 列: 0</span>
                <span class="text-brand-600 font-bold">自動変換中</span>
            </div>
        </div>

    </main>

    <script>
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const statusMsg = document.getElementById('status-msg');
        const statsInfo = document.getElementById('stats-info');

        function convertTable() {
            const raw = inputText.value.trim();
            if (!raw) {
                outputText.value = '';
                statsInfo.textContent = '行: 0 / 列: 0';
                statusMsg.innerHTML = '<i class="fa-solid fa-check text-brand-500 mr-1"></i>準備完了';
                return;
            }

            // Split into rows by newline
            const lines = raw.split(/\r?\n/).map(line => line.split('\t'));
            
            if (lines.length === 0 || (lines.length === 1 && lines[0].length === 1 && lines[0][0] === '')) {
                outputText.value = '';
                statsInfo.textContent = '行: 0 / 列: 0';
                return;
            }

            // Determine max columns
            let maxCols = 0;
            lines.forEach(row => {
                if (row.length > maxCols) maxCols = row.length;
            });

            // Normalize row lengths
            const normalizedRows = lines.map(row => {
                while (row.length < maxCols) {
                    row.push('');
                }
                return row.map(cell => cell.trim().replace(/\|/g, '\\|')); // escape pipes if any
            });

            const rowCount = normalizedRows.length;
            const colCount = maxCols;

            // Build Markdown table
            let mdLines = [];

            // Header row
            const header = normalizedRows[0];
            mdLines.push('| ' + header.join(' | ') + ' |');

            // Separator row (default left align)
            const separator = header.map(() => '---');
            mdLines.push('| ' + separator.join(' | ') + ' |');

            // Body rows
            for (let i = 1; i < rowCount; i++) {
                mdLines.push('| ' + normalizedRows[i].join(' | ') + ' |');
            }

            outputText.value = mdLines.join('\n');
            statsInfo.textContent = `行: ${rowCount} / 列: ${colCount}`;
            statusMsg.innerHTML = '<i class="fa-solid fa-check text-brand-500 mr-1"></i>変換成功';
        }

        function loadSample() {
            inputText.value = `アイテム名\t種類\t数量\t価格\nポーション\t消耗品\t10\t150G\n鉄の剣\t武器\t1\t1200G\nマジカルスタッフ\t武器\t1\t3500G`;
            convertTable();
        }

        function clearInput() {
            inputText.value = '';
            convertTable();
        }

        function copyOutput() {
            const text = outputText.value;
            if (!text) return;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            
            statusMsg.innerHTML = '<i class="fa-solid fa-copy text-brand-500 mr-1"></i>コピーしました！';
            setTimeout(() => {
                statusMsg.innerHTML = '<i class="fa-solid fa-check text-brand-500 mr-1"></i>変換成功';
            }, 2000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadSample();
        });
    </script>
</body>
</html>
